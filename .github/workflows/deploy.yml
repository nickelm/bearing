# Build and deploy Bearing to GitHub Pages (https://<user>.github.io/bearing/).
# Repo Settings -> Pages -> Source must be "GitHub Actions". See docs/decisions.md, decision 40.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The runner's CPU, to match a determinism failure to hardware (decision 234).
      - run: node -e "const c = require('os').cpus(); console.log(c[0].model, c.length, process.version)"
      # GPU tests skip when Dawn finds no adapter (tests/gpu/device.ts).
      - run: npm test
      # `npm run build` would repeat the type check above.
      - run: npx vite build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The determinism tests in fresh processes, where V8's on-stack replacement once
  # broke the front generator (R1.1, decision 234). Never blocks the deploy; a
  # failure prints its assertion, and the front trace names the step that differs.
  determinism:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Twenty fresh processes, two at a time
        run: |
          seq 20 | xargs -P 2 -I{} sh -c 'npx vitest run tests/campaign.test.ts \
            tests/infrastructure.test.ts tests/militaryOverlays.test.ts > run-{}.log 2>&1 \
            || { echo "run {} failed"; grep -A8 -E "FAIL|AssertionError" run-{}.log; exit 1; }'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
