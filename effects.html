<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No icon: without this line the browser asks the site's root for /favicon.ico (a 404). -->
    <link rel="icon" href="data:," />
    <title>Bearing effects sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #effects-stats {
        position: fixed;
        left: 8px;
        bottom: 8px;
        padding: 6px 8px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: #e8e4da;
        background: rgba(20, 22, 26, 0.72);
        border-radius: 3px;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="fatal" hidden></div>
    <div id="effects-stats"></div>
    <noscript>The effects sandbox needs JavaScript and WebGPU.</noscript>
    <script type="module" src="/src/effectsSandbox/main.ts"></script>
  </body>
</html>
